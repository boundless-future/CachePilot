[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachepilot"
version = "0.1.0"
description = "Experimental generation-aware KV offload protection for a pinned vLLM/LMCache stack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cachepilot = "cachepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
